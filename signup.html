<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup - AI Fitness Pro</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  height:100vh;
  background:url('photo1.jpg') no-repeat center/cover;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.75);
}

.signup-box{

  position:relative;
  z-index:2;

  width:360px;

  padding:35px;

  border-radius:20px;

  background:rgba(255,255,255,0.08);

  backdrop-filter:blur(12px);

  box-shadow:0 0 30px rgba(0,0,0,0.5);

}

.signup-box h2{

  text-align:center;

  margin-bottom:10px;
}

.tagline{

  text-align:center;

  opacity:.7;

  font-size:13px;

  margin-bottom:22px;
}

.input-box{

  margin-bottom:14px;
}

.input-box input{

  width:100%;

  padding:12px;

  border:none;

  outline:none;

  border-radius:10px;

  background:rgba(255,255,255,0.1);

  color:white;
}

.signup-btn{

  width:100%;

  padding:12px;

  border:none;

  border-radius:25px;

  background:linear-gradient(45deg,#00eaff,#0077ff);

  color:white;

  font-weight:bold;

  cursor:pointer;

  transition:.3s;
}

.signup-btn:hover{

  transform:translateY(-2px);
}

.login-link{

  margin-top:15px;

  text-align:center;

  font-size:14px;
}

.login-link a{

  color:#00eaff;

  text-decoration:none;
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="signup-box">

  <h2>Create Account</h2>

  <div class="tagline">
    Join AI Fitness Pro Today
  </div>

  <div class="input-box">
    <input type="text" id="name" placeholder="Full Name">
  </div>

  <div class="input-box">
    <input type="text" id="email" placeholder="Email">
  </div>

  <div class="input-box">
    <input type="text" id="phone" placeholder="Phone Number">
  </div>

  <div class="input-box">
    <input type="password" id="password" placeholder="Password">
  </div>

  <button class="signup-btn">
    Sign Up
  </button>

  <div class="login-link">
    Already have account?
    <a href="login.html">Login</a>
  </div>

</div>

<script>

document.querySelector(".signup-btn").onclick = async () => {

  const name =
    document.getElementById("name").value;

  const email =
    document.getElementById("email").value;

  const phone =
    document.getElementById("phone").value;

  const password =
    document.getElementById("password").value;


  if(
    name === "" ||
    email === "" ||
    phone === "" ||
    password === ""
  ){

    alert("Fill all fields");

    return;
  }

  try{

    const response = await fetch(
      "https://ai-fitness-pro-24vl.onrender.com",
      {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          name,
          email,
          phone,
          password,
          role:"user"

        })
      }
    );

    const data = await response.json();

    alert(data.message);

    if(data.success){

      window.location.href = "login.html";
    }

  }

  catch(error){

    alert("Server Error");
  }

}

</script>

</body>
</html>
