<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - AI Fitness Pro</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:#0b0f17;
  color:white;
  overflow:hidden;
}

.bg-glow{
  position:fixed;
  width:500px;
  height:500px;
  background:radial-gradient(circle,rgba(0,234,255,0.12),transparent);
  filter:blur(80px);
  top:-100px;
  right:-100px;
  z-index:0;
}

.main{
  display:flex;
  width:100%;
  height:100vh;
  position:relative;
  z-index:1;
}

.sidebar{
  width:260px;
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(14px);
  border-right:1px solid rgba(255,255,255,0.08);
  padding:30px 20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.logo{
  font-size:28px;
  font-weight:800;
  color:#00eaff;
  margin-bottom:40px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:rgba(255,255,255,0.05);
  color:white;
  text-align:left;
  cursor:pointer;
  transition: 0.3s;
}

.menu button.active, .menu button:hover{
  background:linear-gradient(45deg,#00eaff,#0077ff);
}

.content{
  flex:1;
  padding:35px;
  overflow-y:auto;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  margin-bottom:30px;
}

.admin-tag{
  color:#00eaff;
  background:rgba(0,234,255,0.15);
  padding:8px 14px;
  border-radius:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.card{
  background:rgba(255,255,255,0.05);
  padding:25px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);
}

.card h2{
  color:#00eaff;
  font-size:32px;
}

.table-box{
  background:rgba(255,255,255,0.05);
  padding:25px;
  border-radius:20px;
  display:none;
}

.table-box.active{
  display:block;
}

.table-box h2 {
  margin-bottom: 20px;
  color: #00eaff;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:14px;
  text-align:left;
  font-size: 14px;
}

th{
  color:#00eaff;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

tr{
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.action-btn{
  background:linear-gradient(45deg,#ff4d4d,#ff7a18);
  border:none;
  padding:8px 12px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

.logout-btn{
  margin-top:30px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(45deg,#ff4d4d,#ff7a18);
  color:white;
  cursor:pointer;
}

.rating-stars {
  color: #ff9900;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="main">

  <div class="sidebar">
    <div>
      <div class="logo">⚡ ADMIN</div>

      <div class="menu">
        <button id="btn-users" class="active" onclick="switchTab('users')">Manage Users</button>
        <button id="btn-medical" onclick="switchTab('medical')">Medical Profiles</button>
        <button id="btn-feedback" onclick="switchTab('feedback')">App Feedbacks</button>
      </div>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="content">

    <div class="top-bar">
      <h1>Admin Dashboard</h1>
      <div class="admin-tag">Admin Online</div>
    </div>

    <!-- STATS CARDS -->
    <div class="cards">
      <div class="card">
        <h2 id="totalUsers">0</h2>
        <p>Total Users</p>
      </div>

      <div class="card">
        <h2 id="medicalProfiles">0</h2>
        <p>Medical Profiles</p>
      </div>

      <div class="card">
        <h2 id="totalFeedbacks">0</h2>
        <p>User Feedbacks</p>
      </div>
    </div>

    <!-- USERS TABLE -->
    <div id="tab-users" class="table-box active">
      <h2>Manage Users</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="userTable"></tbody>
      </table>
    </div>

    <!-- MEDICAL PROFILES TABLE -->
    <div id="tab-medical" class="table-box">
      <h2>Medical Profiles</h2>
      <table>
        <thead>
          <tr>
            <th>User ID</th>
            <th>Age / Gender</th>
            <th>Height / Weight</th>
            <th>Blood Group</th>
            <th>Conditions / Allergies</th>
          </tr>
        </thead>
        <tbody id="medicalTable"></tbody>
      </table>
    </div>

    <!-- FEEDBACKS TABLE -->
    <div id="tab-feedback" class="table-box">
      <h2>User Feedbacks & Ratings</h2>
      <table>
        <thead>
          <tr>
            <th>User ID</th>
            <th>Rating</th>
            <th>Feedback Message</th>
            <th>Date Submitted</th>
          </tr>
        </thead>
        <tbody id="feedbackTable"></tbody>
      </table>
    </div>

  </div>
</div>

<script>
const API = "http://localhost:2000";

/* TAB SWITCHING SYSTEM */
function switchTab(tab) {
  document.querySelectorAll('.table-box').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.menu button').forEach(el => el.classList.remove('active'));

  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById(`btn-${tab}`).classList.add('active');
}

/* LOAD USERS */
async function loadUsers() {
  try {
    const res = await fetch(`${API}/api/admin/users`);
    const users = await res.json();

    document.getElementById("totalUsers").innerText = users.length;

    const table = document.getElementById("userTable");
    table.innerHTML = "";

    if (!users.length) {
      table.innerHTML = `<tr><td colspan="4">No users found</td></tr>`;
      return;
    }

    users.forEach(user => {
      table.innerHTML += `
        <tr>
          <td>${user.name || "N/A"}</td>
          <td>${user.email || "-"}</td>
          <td>${user.role || "-"}</td>
          <td>
            <button class="action-btn" onclick="deleteUser('${user._id}')">Delete</button>
          </td>
        </tr>
      `;
    });
  } catch (err) {
    console.error("Load users failed:", err);
  }
}

/* LOAD MEDICAL PROFILES */
async function loadMedicalProfiles() {
  try {
    const res = await fetch(`${API}/api/admin/medical`);
    const profiles = await res.json();

    document.getElementById("medicalProfiles").innerText = profiles.length;

    const table = document.getElementById("medicalTable");
    table.innerHTML = "";

    if (!profiles.length) {
      table.innerHTML = `<tr><td colspan="5">No medical profiles submitted</td></tr>`;
      return;
    }

    profiles.forEach(p => {
      table.innerHTML += `
        <tr>
          <td>${p.userId || "Anonymous"}</td>
          <td>${p.age || "-"} Yrs / ${p.gender || "-"}</td>
          <td>${p.height || "-"} cm / ${p.weight || "-"} kg</td>
          <td><span style="color:#00eaff;">${p.bloodGroup || "-"}</span></td>
          <td>${(p.medicalConditions && p.medicalConditions.join(", ")) || "None"}</td>
        </tr>
      `;
    });
  } catch (err) {
    console.error("Load medical profiles failed:", err);
  }
}

/* LOAD FEEDBACKS */
async function loadFeedbacks() {
  try {
    const res = await fetch(`${API}/api/admin/feedbacks`);
    const feedbacks = await res.json();

    document.getElementById("totalFeedbacks").innerText = feedbacks.length;

    const table = document.getElementById("feedbackTable");
    table.innerHTML = "";

    if (!feedbacks.length) {
      table.innerHTML = `<tr><td colspan="4">No feedback received yet</td></tr>`;
      return;
    }

    feedbacks.forEach(f => {
      table.innerHTML += `
        <tr>
          <td>${f.userId || "Anonymous"}</td>
          <td class="rating-stars">⭐ ${f.rating} / 5</td>
          <td>${f.message || "-"}</td>
          <td>${new Date(f.createdAt).toLocaleDateString()}</td>
        </tr>
      `;
    });
  } catch (err) {
    console.error("Load feedbacks failed:", err);
  }
}

/* DELETE USER */
async function deleteUser(id) {
  if (!confirm("Are you sure you want to delete this user?")) return;

  try {
    const res = await fetch(`${API}/api/admin/users/${id}`, { method: "DELETE" });
    const data = await res.json();

    if (data.success) {
      loadUsers();
    } else {
      alert("Delete failed");
    }
  } catch (err) {
    alert("Server error while deleting user");
  }
}

/* INIT */
window.onload = () => {
  if (localStorage.getItem("role") !== "admin") {
    alert("Unauthorized Access!");
    window.location.href = "login.html";
    return;
  }

  loadUsers();
  loadMedicalProfiles();
  loadFeedbacks();
};

/* LOGOUT */
function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}
</script>

</body>
</html>
