<!DOCTYPE html>
<html>
<head>
<title>Advanced BMI Calculator</title>

<style>
body{
  background:#000;
  color:white;
  text-align:center;
  padding:40px;
  font-family:sans-serif;
}

/* BACK BUTTON */
.back-btn{
  position:fixed;
  top:20px;
  left:20px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  cursor:pointer;
  font-size:14px;
  transition:0.3s;
}

.back-btn:hover{
  background:linear-gradient(45deg,#ff4d4d,#ff9900);
}

/* INPUTS */
input,select,button{
  padding:10px;
  margin:8px;
  border:none;
  border-radius:8px;
}

button{
  background:#ff4d4d;
  color:white;
  cursor:pointer;
}

/* GRID */
.box{
  margin-top:20px;
}

.section{
  margin-top:20px;
}

label{
  display:block;
  margin:6px;
}
</style>
</head>

<body>

<div class="back-btn" onclick="goBack()">← Back</div>

<h1>⚖ Advanced BMI AI Calculator</h1>

<!-- BASIC INPUTS -->
<input type="number"
id="height"
placeholder="Height (cm)"
min="1"
oninput="this.value=this.value.replace(/-/g,'')">
<input type="number"
id="weight"
placeholder="Weight (kg)"
min="1"
oninput="this.value=this.value.replace(/-/g,'')">
<br>

<input type="number"
id="age"
placeholder="Age"
min="1"
oninput="this.value=this.value.replace(/-/g,'')">

<select id="gender">
  <option>Male</option>
  <option>Female</option>
</select>

<select id="activity">
  <option value="1.2">Low Activity</option>
  <option value="1.4">Moderate Activity</option>
  <option value="1.7">High Activity</option>
</select>

<select id="goal">
  <option value="maintain">Maintain</option>
  <option value="loss">Weight Loss</option>
  <option value="gain">Weight Gain</option>
</select>

<!-- CONDITIONS -->
<div class="section">
<h3>Health Conditions</h3>

<label><input type="checkbox" id="diabetes"> Diabetes</label>
<label><input type="checkbox" id="bp"> Blood Pressure</label>
<label><input type="checkbox" id="heart"> Heart Issue</label>
<label><input type="checkbox" id="asthma"> Asthma</label>
<label><input type="checkbox" id="backpain"> Back Pain</label>
</div>

<button onclick="calcBMI()">Calculate BMI AI</button>

<h2 id="result"></h2>
<p id="advice"></p>

<script>

function calcBMI(){

let h = document.getElementById("height").value / 100;
let w = document.getElementById("weight").value;
let age = document.getElementById("age").value;
let gender = document.getElementById("gender").value;
let activity = document.getElementById("activity").value;
let goal = document.getElementById("goal").value;

if(!h || !w){
  alert("Enter height & weight");
  return;
}

/* BMI */
let bmi = (w/(h*h)).toFixed(1);

/* STATUS */
let status =
bmi<18.5?"Underweight":
bmi<25?"Normal":
bmi<30?"Overweight":"Obese";

/* AI ADJUSTMENT */
let message = "";

if(document.getElementById("diabetes").checked){
  message += "⚠ Control sugar intake. ";
}

if(document.getElementById("bp").checked){
  message += "⚠ Reduce salt. ";
}

if(document.getElementById("heart").checked){
  message += "⚠ Avoid fatty foods. ";
}

if(document.getElementById("asthma").checked){
  message += "⚠ Maintain breathing exercises. ";
}

if(document.getElementById("backpain").checked){
  message += "⚠ Avoid heavy lifting. ";
}

/* GOAL ADJUSTMENT */
if(goal === "loss"){
  message += "🔥 Focus on calorie deficit diet. ";
}
if(goal === "gain"){
  message += "🔥 Increase protein + calories. ";
}

/* FINAL OUTPUT */
document.getElementById("result").innerText =
"BMI: " + bmi + " (" + status + ")";

document.getElementById("advice").innerText =
message || "✅ Healthy profile detected. Maintain routine.";

}

function goBack(){
window.location.href="dashboard1.html";
}

</script>

</body>
</html>
