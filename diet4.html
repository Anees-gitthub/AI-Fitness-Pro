<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Diet Plan</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background: radial-gradient(circle at top,#1a1a1a,#000);
  color:white;
  height:100vh;
  overflow:hidden;
}

/* HEADER */
.title{
  text-align:center;
  padding:10px;
}

.nav{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  padding:8px 14px;
  border:none;
  border-radius:20px;
  background:#222;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  background:linear-gradient(45deg,#00c6ff,#0072ff);
}

/* SCROLL */
.scroll{
  height:calc(100vh - 140px);
  overflow-y:auto;
  padding:10px;
}

/* GRID */
.container{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

/* CARD */
.card{
  aspect-ratio:1/1;
  position:relative;
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  position:absolute;
  width:90%;
  height:90%;
  top:5%;
  left:5%;
  object-fit:cover;
  border-radius:15px;
}

.card::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(to top,rgba(0,0,0,0.8),transparent);
}

.card h3{
  position:absolute;
  bottom:10px;
  left:10px;
  z-index:2;
  font-size:13px;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  width:90%;
  max-width:420px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
}

.modal img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.modal-text{
  padding:15px;
  color:#ccc;
  font-size:14px;
}

.close{
  position:absolute;
  top:20px;
  right:20px;
  font-size:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="title">
<h2>🥗 AI Diet Planner</h2>
</div>

<div class="nav">
<button class="btn" onclick="load('weightGain')">Weight Gain</button>
<button class="btn" onclick="load('weightLoss')">Weight Loss</button>
<button class="btn" onclick="load('highProtein')">High Protein</button>
<button class="btn" onclick="load('highCalories')">High Calories</button>
<button class="btn" onclick="load('highCarbs')">High Carbs</button>
<button class="btn" onclick="load('fiber')">Fiber Rich</button>
<button class="btn" onclick="goBack()">Back</button>
</div>

<div class="scroll">
<div class="container" id="dietContainer"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal(event)">
<div class="modal-content" onclick="event.stopPropagation()">
<img id="modalImg">
<div class="modal-text">
<h3 id="modalTitle"></h3>
<p id="modalDesc"></p>
</div>
</div>
<div class="close" onclick="closeModal()">❌</div>
</div>

};

function load(type){
  render(data[type]);
}

function render(list){
  const c=document.getElementById("dietContainer");
  c.innerHTML="";
  list.forEach(d=>{
    c.innerHTML+=`
    <div class="card" onclick="openModal('${d.t}','${d.i}',\`${d.d}\`)">
      <img src="${d.i}">
      <h3>${d.t}</h3>
    </div>`;
  });
}

/* ✅ ONLY UPGRADED FUNCTION (MODAL ENHANCEMENT) */
function openModal(t,i,d){

  let extra = `
  <br><br>
  <b>🍽 AI Insight:</b> ${getInsight(t)}
  <br><br>
  <b>⚡ Benefit:</b> ${getBenefit(t)}
  <br><br>
  <b>⏰ Best Time:</b> ${getTime(t)}
  `;

  document.getElementById("modal").style.display="flex";
  document.getElementById("modalTitle").innerText=t;
  document.getElementById("modalImg").src=i;
  document.getElementById("modalDesc").innerHTML=d + extra;
}

/* AI HELPERS */
function getInsight(t){
  if(t.toLowerCase().includes("protein")) return "Builds muscle and repairs tissues.";
  if(t.toLowerCase().includes("loss")) return "Supports fat burning and calorie control.";
  if(t.toLowerCase().includes("gain")) return "Helps increase body mass effectively.";
  if(t.toLowerCase().includes("fiber")) return "Improves digestion and gut health.";
  return "Balanced nutrition for daily fitness.";
}

function getBenefit(t){
  if(t.toLowerCase().includes("protein")) return "Strength + muscle recovery.";
  if(t.toLowerCase().includes("loss")) return "Fat reduction support.";
  if(t.toLowerCase().includes("gain")) return "Healthy weight gain.";
  return "Overall health improvement.";
}

function getTime(t){
  if(t.toLowerCase().includes("breakfast")) return "Morning (7–10 AM)";
  if(t.toLowerCase().includes("lunch")) return "Afternoon (12–3 PM)";
  if(t.toLowerCase().includes("dinner")) return "Evening (7–9 PM)";
  return "Anytime based on diet plan";
}

function closeModal(e){
  if(!e || e.target.id==="modal"){
    document.getElementById("modal").style.display="none";
  }
}

function goBack(){
  window.location.href="dashboard1.html";
}

load("weightGain");

</script>
